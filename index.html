<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b57d0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Comprobador QR</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{margin:0;background:#f4f7fb;color:#172033;font-family:system-ui,sans-serif}
.app{max-width:560px;margin:auto;padding:16px}.card{background:#fff;padding:16px;margin:12px 0;border-radius:20px;box-shadow:0 4px 20px #0001}
h1{text-align:center}.sub{text-align:center;color:#64748b}nav,.row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
nav{grid-template-columns:repeat(3,1fr);margin:12px 0}button{border:0;border-radius:13px;padding:13px;font-size:15px;font-weight:700}
.primary{background:#0b57d0;color:white}.secondary{background:#e8eefc;color:#1647a5}.danger{background:#fee2e2;color:#991b1b}
input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:17px;margin:7px 0}
#reader{min-height:260px;background:#111;border-radius:15px;overflow:hidden}.hidden{display:none!important}
.result{text-align:center;padding:20px;border-radius:16px;margin-top:12px}.ok{background:#dcfce7;color:#166534}.no{background:#fee2e2;color:#991b1b}
.big{font-size:29px;font-weight:900}.muted{font-size:13px;color:#64748b}.list{max-height:330px;overflow:auto}
.item{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #e2e8f0}
.item button{padding:7px 10px;font-size:13px}.page{display:block}
</style>
</head>
<body>
<main class="app">
<h1>Comprobador QR</h1><div class="sub">Consulta y gestiona tu base de datos</div>
<nav>
<button class="primary" onclick="show('scan')">📷 Escanear</button>
<button class="secondary" onclick="show('manage')">🗃️ Base</button>
<button class="secondary" onclick="show('backup')">💾 Datos</button>
</nav>

<section id="scan" class="page">
<div class="card">
<div id="reader"></div>
<div class="row" style="margin-top:9px">
<button id="start" class="primary">📷 Iniciar cámara</button>
<button id="stop" class="secondary hidden">Detener</button>
</div>
</div>
<div class="card">
<b>Comprobación manual</b>
<input id="manual" placeholder="Escribe o pega el código">
<button class="primary" onclick="check(document.getElementById('manual').value)">Comprobar</button>
<div id="result"></div>
</div>
</section>

<section id="manage" class="page hidden">
<div class="card">
<b>Base de datos</b><p class="muted">Total: <span id="count"></span> códigos</p>
<input id="newCode" placeholder="Nuevo código">
<button class="primary" onclick="addCode()">＋ Añadir</button>
<div class="list" id="list"></div>
</div>
</section>

<section id="backup" class="page hidden">
<div class="card">
<b>Importar Excel / CSV</b>
<p class="muted">Se utiliza la primera columna como código.</p>
<input type="file" id="file" accept=".xlsx,.xls,.csv">
<div class="row"><button class="primary" onclick="importFile(false)">Reemplazar</button><button class="secondary" onclick="importFile(true)">Añadir</button></div>
</div>
<div class="card">
<b>Exportar base actual</b>
<div class="row"><button class="primary" onclick="exportXlsx()">Excel</button><button class="secondary" onclick="exportCsv()">CSV</button></div>
</div>
<div class="card"><button class="danger" onclick="resetDB()">Restaurar base original</button></div>
</section>
</main>

<script src="data.js"></script>
<script>
let db=new Set(JSON.parse(localStorage.getItem('qr_codes_v3')||'null')||INITIAL_CODES),scanner=null;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('qr_codes_v3',JSON.stringify([...db]));render()}
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');render()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){$('count').textContent=db.size;$('list').innerHTML=[...db].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).map(c=>`<div class="item"><span>${esc(c)}</span><button class="danger" onclick="removeCode(${JSON.stringify(c)})">Eliminar</button></div>`).join('')}
function addCode(){let x=$('newCode').value.trim();if(!x)return;if(db.has(x))alert('Ese código ya existe.');else{db.add(x);$('newCode').value='';save()}}
function removeCode(x){if(confirm('¿Eliminar '+x+'?')){db.delete(x);save()}}
function check(raw){let c=String(raw??'').trim(),ok=db.has(c);$('result').className='result '+(ok?'ok':'no');$('result').innerHTML=`<div class="big">${ok?'✓ EXISTE':'✕ NO EXISTE'}</div><div>${esc(c||'Sin código')}</div>`}
$('start').onclick=async()=>{scanner=new Html5Qrcode('reader');$('start').classList.add('hidden');$('stop').classList.remove('hidden');try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},t=>{check(t);scanner.stop().catch(()=>{});$('start').classList.remove('hidden');$('stop').classList.add('hidden')},()=>{})}catch(e){alert('No se pudo abrir la cámara. Comprueba el permiso y que la web use HTTPS.');$('start').classList.remove('hidden');$('stop').classList.add('hidden')}}
$('stop').onclick=()=>{if(scanner)scanner.stop().catch(()=>{});$('start').classList.remove('hidden');$('stop').classList.add('hidden')}
async function importFile(add){let f=$('file').files[0];if(!f){alert('Selecciona un archivo.');return}try{let rows;if(f.name.toLowerCase().endsWith('.csv'))rows=(await f.text()).split(/\r?\n/).map(x=>[x.split(',')[0]]);else{let d=await f.arrayBuffer(),w=XLSX.read(d);rows=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{header:1})}let incoming=new Set(rows.map(r=>String(r?.[0]??'').trim()).filter(x=>x&&x.toLowerCase()!=='codigo'&&x.toLowerCase()!=='código'));if(!add)db=incoming;else incoming.forEach(x=>db.add(x));save();alert(`Importados ${incoming.size}. Total: ${db.size}.`)}catch(e){alert('No se pudo leer el archivo.')}}
function exportCsv(){download(new Blob(['Codigo\n'+[...db].sort().map(x=>JSON.stringify(x)).join('\n')],{type:'text/csv;charset=utf-8'}),'base_datos_qr.csv')}
function exportXlsx(){let ws=XLSX.utils.aoa_to_sheet([['Codigo'],...[...db].sort().map(x=>[x])]);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Codigos');XLSX.writeFile(wb,'base_datos_qr.xlsx')}
function download(b,n){let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}
function resetDB(){if(confirm('¿Restaurar los 69 códigos originales?')){db=new Set(INITIAL_CODES);save()}}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
